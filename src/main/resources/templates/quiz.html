<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Quiz</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<h1>Quiz</h1>
<nav>
    <a href="javascript:history.back()">← Back</a>
    <form th:action="@{/logout}" method="post" style="display:inline; margin-left:1rem;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Logout</button>
    </form>
</nav>
<form th:action="@{/quiz/submit-form}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="username" th:value="${username}">
    <fieldset th:each="question : ${questions}"><legend th:text="${question.questionText}"></legend>
        <label th:each="option : ${question.options}"><input type="radio" th:name="|answer-${question.id}|" th:value="${option}" required><span th:text="${option}"></span></label>
    </fieldset>
    <button type="submit">Submit answers</button>
</form>
</body></html>
