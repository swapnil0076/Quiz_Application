<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Registration</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<h1>Register</h1>
<form th:action="@{/user/register}" th:object="${user}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Username <input th:field="*{username}" required minlength="3" maxlength="30"></label>
    <small th:errors="*{username}"></small><br>
    <label>Password <input type="password" th:field="*{password}" required minlength="6"></label>
    <small th:errors="*{password}"></small><br>
    <label>Email <input type="email" th:field="*{email}" required></label>
    <small th:errors="*{email}"></small><br>
    <label>Role
        <select th:field="*{role}" required><option value="USER">User</option><option value="ADMIN">Admin</option></select>
    </label><br>
    <button type="submit">Register</button>
</form>
<a th:href="@{/user/login}">Back to login</a>
</body>
</html>
